<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oma Laulukoulu & Nuottimittari</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { text-align: center; color: #2c3e50; }
        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2980b9; }
        #stopBtn { background-color: #e74c3c; display: none; }
        
        /* Yousician-tyylinen nuottinäyttö */
        .pitch-container {
            text-align: center;
            padding: 20px;
            background: #2c3e50;
            color: #2ecc71;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }
        .hz-text {
            font-size: 14px;
            color: #bdc3c7;
            font-weight: normal;
        }
        
        .lyrics {
            white-space: pre-line;
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
            font-style: italic;
            background: #fdfefe;
            padding: 15px;
            border-left: 4px solid #3498db;
        }
        #palauteBox {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: none;
        }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Oma Laulukoulu & Nuottimittari 🎤</h1>

    <!-- Yousician-mittari -->
    <div class="box">
        <h3>Reaaliaikainen nuotti (Yousician-tyyliin)</h3>
        <div class="pitch-container">
            <span id="noteDisplay">Käynnistä äänitys...</span>
            <div id="hzDisplay" class="hz-text">- Hz</div>
        </div>
    </div>

    <!-- Sanoitukset -->
    <div class="box">
        <h3>Kulkuri ja joutsen</h3>
        <div class="lyrics">
            Tääl' yksinäinen kulkuri laulelee,
            kun joutsenet lampeen laskeutuu.
            Niin kauniisti siivet ne kimmeltää,
            ja rantaan jo varjot sulkeutuu.
        </div>
    </div>

    <!-- Äänityskontrollit -->
    <div class="box">
        <button id="startBtn" onclick="aloitaKaikki()">Aloita laulutunti</button>
        <button id="stopBtn" onclick="lopetaKaikki()">Lopeta ja ota palaute</button>
        
        <div id="audioPlayerBox" style="margin-top: 15px; display: none;">
            <p>Kuuntele oma veto:</p>
            <audio id="audioPlayback" controls></audio>
        </div>
    </div>

    <!-- Palaute -->
    <div id="palauteBox" class="box">
        <h3>Opettajan palaute:</h3>
        <p id="palauteTeksti"></p>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let audioContext;
        let analyser;
        let dataArray;
        let source;
        let animationId;

        const kehut = [
            "Wau! Lauloitpa upealla energialla! Äänesi väri pääsee tässä kappaleessa todella kauniisti esiin.",
            "Loistava suoritus! Erityisesti rytmi pysyi hienosti kasassa ja tulkinnassa oli aitoa tunnetta.",
            "Upeaa kuultavaa! Huomaa, että olet harjoitellut – äänenpito oli vakaata ja varmalla pohjalla.",
            "Mahtava veto! Korkeammat äänet soivat todella puhtaasti ja rohkeasti. Jatka samaan malliin!"
        ];

        // Nuottien nimet taajuuksille
        const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        function noteFromPitch(frequency) {
            const noteNum = 12 * (Math.log(frequency / 440) / Math.log(2));
            return Math.round(noteNum) + 69;
        }

        async function aloitaKaikki() {
            audioChunks = [];
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            // 1. ÄÄNITYS (Kuten Audacity)
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                document.getElementById("audioPlayback").src = URL.createObjectURL(audioBlob);
                document.getElementById("audioPlayerBox").style.display = "block";
                annaPalautetta();
            };
            mediaRecorder.start();

            // 2. REAALIAIKAINEN ANALYYSI (Yousician)
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);
            dataArray = new Float32Array(analyser.fftSize);

            document.getElementById("startBtn").style.display = "none";
            document.getElementById("stopBtn").style.display = "block";
            document.getElementById("palauteBox").style.display = "none";

            paivitaNuotti();
        }

        // Autokorrelaatio-algoritmi (laskee äänen korkeuden)
        function autoCorrelate(buffer, sampleRate) {
            let SIZE = buffer.length;
            let maxSamples = Math.floor(SIZE / 2);
            let bestOffset = -1;
            let bestCorrelation = 0;
            let rms = 0;

            for (let i = 0; i < SIZE; i++) {
                let val = buffer[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.01) return -1; // Liian hiljainen ääni

            let lastCorrelation = 1;
            for (let offset = 0; offset < maxSamples; offset++) {
                let correlation = 0;

                for (let i = 0; i < maxSamples; i++) {
                    correlation += Math.abs((buffer[i]) - (buffer[i + offset]));
                }
                correlation = 1 - (correlation / maxSamples);
                if ((correlation > 0.9) && (correlation > lastCorrelation)) {
                    if (correlation > bestCorrelation) {
                        bestCorrelation = correlation;
                        bestOffset = offset;
                    }
                }
                lastCorrelation = correlation;
            }
            if (bestCorrelation > 0.01) {
                return sampleRate / bestOffset;
            }
            return -1;
        }

        function paivitaNuotti() {
            analyser.getFloatTimeDomainData(dataArray);
            let pitch = autoCorrelate(dataArray, audioContext.sampleRate);

            if (pitch === -1 || pitch > 1000) {
                // Ei lauleta mitään tai ääni on häiriötä
            } else {
                let noteNum = noteFromPitch(pitch);
                let noteName = noteStrings[noteNum % 12];
                let octave = Math.floor(noteNum / 12) - 1;
                
                document.getElementById("noteDisplay").innerText = noteName + octave;
                document.getElementById("hzDisplay").innerText = Math.round(pitch) + " Hz";
            }

            animationId = requestAnimationFrame(paivitaNuotti);
        }

        function lopetaKaikki() {
            mediaRecorder.stop();
            cancelAnimationFrame(animationId);
            if (audioContext) audioContext.close();
            
            document.getElementById("startBtn").style.display = "block";
            document.getElementById("stopBtn").style.display = "none";
            document.getElementById("noteDisplay").innerText = "Tunti päättyi";
        }

        function annaPalautetta() {
            const satunnainenKehu = kehut[Math.floor(Math.random() * kehut.length)];
            document.getElementById("palauteTeksti").innerText = satunnainenKehu;
            document.getElementById("palauteBox").style.display = "block";
        }
    </script>
</body>
</html>
