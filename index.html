<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rokin Laulutreenari - Sanat ja Sävel</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #f1c40f;
            --text: #ffffff;
            --text-dim: #555555;
            --active-bg: rgba(241, 196, 15, 0.15);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            padding: 2rem;
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border: 2px solid var(--accent);
        }

        h1 { color: var(--accent); margin-bottom: 0.5rem; }
        .subtitle { color: #888; margin-bottom: 2rem; }

        select {
            width: 100%;
            padding: 0.8rem;
            background: #333;
            color: white;
            border: 1px solid var(--accent);
            border-radius: 6px;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            cursor: pointer;
        }

        .lyrics-container {
            background: #151515;
            padding: 2rem;
            border-radius: 8px;
            margin: 2rem 0;
            min-height: 200px;
            text-align: center;
            line-height: 2.2;
            font-size: 1.5rem;
            border-left: 4px solid var(--accent);
        }

        .word {
            display: inline-block;
            color: var(--text-dim);
            margin: 0 5px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .word.active {
            color: var(--accent);
            background-color: var(--active-bg);
            font-weight: bold;
            transform: scale(1.15);
        }

        .word.passed {
            color: #aaaaaa;
            font-weight: normal;
        }

        .line-break {
            display: block;
            height: 1.2rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        button {
            background: var(--accent);
            color: black;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        button:hover { background: #f39c12; transform: scale(1.02); }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        .btn-reset { background: #e74c3c; color: white; }
        .btn-reset:hover { background: #c0392b; }

        .tip {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎸 RockLaulu-Treenari v2</h1>
        <p class="subtitle">Teksti näkyvissä – värikorostus opastaa sävelen!</p>

        <label for="song-select">Valitse kappale:</label>
        <select id="song-select" onchange="loadSong()">
            <option value="dontCry">Guns N' Roses - Don't Cry (Kertosäe)</option>
            <option value="novemberRain">Guns N' Roses - November Rain (Loppuhuipennus)</option>
        </select>

        <div class="lyrics-container" id="lyrics-display"></div>

        <div class="controls">
            <button id="start-btn" onclick="startSong()">Aloita alusta</button>
            <button id="next-btn" onclick="nextNote()">Seuraava (Välilyönti)</button>
            <button class="btn-reset" onclick="resetSong()">Nollaa</button>
        </div>

        <p class="tip">Vinkki: Paina <strong>välilyöntiä</strong> vaihtaaksesi seuraavaan sanaan.</p>
    </div>

    <script>
        let audioCtx = null;

        const notes = {
            'G3': 196.00, 'A3': 220.00, 'A#3': 233.08, 'B3': 246.94,
            'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'G#4': 415.30,
            'A4': 440.00, 'A#4': 466.16, 'B4': 493.88, 'C5': 523.25, 'C#5': 554.37, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46
        };

        const songDatabase = {
            dontCry: [
                { text: "Don't", note: "A4", newLine: false },
                { text: "you", note: "G4", newLine: false },
                { text: "cry", note: "F4", newLine: false },
                { text: "tonight", note: "E4", newLine: false },
                { text: "...", note: "D4", newLine: false },
                { text: "", note: "", newLine: true },
                { text: "There's", note: "A4", newLine: false },
                { text: "a", note: "A4", newLine: false },
                { text: "heaven", note: "G4", newLine: false },
                { text: "above", note: "F4", newLine: false },
                { text: "you", note: "E4", newLine: false },
                { text: "baby", note: "D4", newLine: false },
                { text: "", note: "", newLine: true },
                { text: "Don't", note: "A4", newLine: false },
                { text: "you", note: "G4", newLine: false },
                { text: "cry", note: "F4", newLine: false },
                { text: "tonight", note: "E4", newLine: false }
            ],
            novemberRain: [
                { text: "Don't", note: "G4", newLine: false },
                { text: "you", note: "A4", newLine: false },
                { text: "think", note: "A#4", newLine: false },
                { text: "that", note: "C5", newLine: false },
                { text: "you", note: "D5", newLine: false },
                { text: "need", note: "C5", newLine: false },
                { text: "somebody?", note: "A#4", newLine: false },
                { text: "", note: "", newLine: true },
                { text: "Don't", note: "G4", newLine: false },
                { text: "you", note: "A4", newLine: false },
                { text: "think", note: "A#4", newLine: false },
                { text: "that", note: "C5", newLine: false },
                { text: "you", note: "D5", newLine: false },
                { text: "need", note: "F5", newLine: false },
                { text: "someone?", note: "D5", newLine: false },
                { text: "", note: "", newLine: true },
                { text: "Everybody", note: "C5", newLine: false },
                { text: "needs", note: "A#4", newLine: false },
                { text: "somebody", note: "A4", newLine: false },
                { text: "...", note: "G4", newLine: false }
            ]
        };

        let currentSong = [];
        let currentIndex = -1;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function loadSong() {
            const songKey = document.getElementById('song-select').value;
            currentSong = songDatabase[songKey];
            currentIndex = -1;
            
            const display = document.getElementById('lyrics-display');
            display.innerHTML = '';

            currentSong.forEach((item, index) => {
                if (item.newLine) {
                    const br = document.createElement('div');
                    br.className = 'line-break';
                    display.appendChild(br);
                } else {
                    const span = document.createElement('span');
                    span.className = 'word';
                    span.id = `word-${index}`;
                    span.innerText = item.text;
                    display.appendChild(span);
                }
            });
        }

        function startSong() {
            initAudio();
            currentIndex = 0;
            while (currentIndex < currentSong.length && currentSong[currentIndex].newLine) {
                currentIndex++;
            }
            updateHighlightAndPlay();
        }

        function updateHighlightAndPlay() {
            currentSong.forEach((item, index) => {
                const el = document.getElementById(`word-${index}`);
                if (el) {
                    if (index < currentIndex) {
                        el.className = 'word passed';
                    } else if (index === currentIndex) {
                        el.className = 'word active';
                    } else {
                        el.className = 'word';
                    }
                }
            });

            if (currentIndex >= currentSong.length) {
                return;
            }

            const currentStep = currentSong[currentIndex];

            if (currentStep && currentStep.note && notes[currentStep.note]) {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.value = notes[currentStep.note];
                
                gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            }
        }

        function nextNote() {
            if (currentIndex === -1) {
                startSong();
                return;
            }

            if (currentIndex < currentSong.length) {
                currentIndex++;
                while (currentIndex < currentSong.length && currentSong[currentIndex].newLine) {
                    currentIndex++;
                }
                updateHighlightAndPlay();
            }
        }

        function resetSong() {
            currentIndex = -1;
            loadSong();
        }

        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
                event.preventDefault();
                nextNote();
            }
        });

        loadSong();
    </script>
</body>
</html>
