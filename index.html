<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automaattinen RockLaulu-Treenari</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #f1c40f;
            --text: #ffffff;
            --text-dim: #444444;
            --active-bg: rgba(241, 196, 15, 0.25);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            padding: 2rem;
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border: 2px solid var(--accent);
        }

        h1 { color: var(--accent); margin-bottom: 0.5rem; }
        .subtitle { color: #888; margin-bottom: 2rem; }

        select {
            width: 100%;
            padding: 0.8rem;
            background: #333;
            color: white;
            border: 1px solid var(--accent);
            border-radius: 6px;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            cursor: pointer;
        }

        .lyrics-container {
            background: #151515;
            padding: 2rem;
            border-radius: 8px;
            margin: 2rem 0;
            min-height: 200px;
            text-align: center;
            line-height: 2.5;
            font-size: 1.6rem;
            border-left: 4px solid var(--accent);
        }

        .word {
            display: inline-block;
            color: var(--text-dim);
            margin: 0 6px;
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.15s ease;
        }

        .word.active {
            color: var(--accent);
            background-color: var(--active-bg);
            font-weight: bold;
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.3);
        }

        .word.passed {
            color: #888888;
        }

        .line-break {
            display: block;
            height: 1.5rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        button {
            background: var(--accent);
            color: black;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        button:hover { background: #f39c12; transform: scale(1.02); }
        .btn-reset { background: #e74c3c; color: white; }
        .btn-reset:hover { background: #c0392b; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎤 Automaattinen Karaoke-Treenari</h1>
        <p class="subtitle">Paina vain kerran alussa – laite soittaa melodian ja liikuttaa sanoja!</p>

        <label for="song-select">Valitse kappale:</label>
        <select id="song-select" onchange="loadSong()">
            <option value="dontCry">Guns N' Roses - Don't Cry (Kertosäe)</option>
            <option value="novemberRain">Guns N' Roses - November Rain</option>
        </select>

        <div class="lyrics-container" id="lyrics-display"></div>

        <div class="controls">
            <button id="start-btn" onclick="startSong()">▶ ALOITA LAULU</button>
            <button class="btn-reset" onclick="resetSong()">Pysäytä / Nollaa</button>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let playTimeout = null;

        const notes = {
            'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'A4': 440.00,
            'A#4': 466.16, 'C5': 523.25, 'D5': 587.33, 'F5': 698.46
        };

        // Kestot millisekunneissa (kuinka pitkään kukin sana soi/kestää)
        const songDatabase = {
            dontCry: [
                { text: "Don't", note: "A4", duration: 800 },
                { text: "you", note: "G4", duration: 600 },
                { text: "cry", note: "F4", duration: 1200 },
                { text: "tonight", note: "E4", duration: 1400 },
                { text: "...", note: "D4", duration: 1000 },
                { text: "", note: "", newLine: true },
                { text: "There's", note: "A4", duration: 600 },
                { text: "a", note: "A4", duration: 400 },
                { text: "heaven", note: "G4", duration: 1000 },
                { text: "above", note: "F4", duration: 1000 },
                { text: "you", note: "E4", duration: 800 },
                { text: "baby", note: "D4", duration: 1600 },
                { text: "", note: "", newLine: true },
                { text: "Don't", note: "A4", duration: 800 },
                { text: "you", note: "G4", duration: 600 },
                { text: "cry", note: "F4", duration: 1200 },
                { text: "tonight", note: "E4", duration: 2000 }
            ],
            novemberRain: [
                { text: "Don't", note: "G4", duration: 800 },
                { text: "you", note: "A4", duration: 600 },
                { text: "think", note: "A#4", duration: 600 },
                { text: "that", note: "C5", duration: 600 },
                { text: "you", note: "D5", duration: 800 },
                { text: "need", note: "C5", duration: 800 },
                { text: "somebody?", note: "A#4", duration: 1800 },
                { text: "", note: "", newLine: true },
                { text: "Don't", note: "G4", duration: 800 },
                { text: "you", note: "A4", duration: 600 },
                { text: "think", note: "A#4", duration: 600 },
                { text: "that", note: "C5", duration: 600 },
                { text: "you", note: "D5", duration: 800 },
                { text: "need", note: "F5", duration: 800 },
                { text: "someone?", note: "D5", duration: 1800 },
                { text: "", note: "", newLine: true },
                { text: "Everybody", note: "C5", duration: 1200 },
                { text: "needs", note: "A#4", duration: 800 },
                { text: "somebody", note: "A4", duration: 1200 },
                { text: "...", note: "G4", duration: 1500 }
            ]
        };

        let currentSong = [];
        let currentIndex = -1;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function loadSong() {
            resetSong();
            const songKey = document.getElementById('song-select').value;
            currentSong = songDatabase[songKey];
            
            const display = document.getElementById('lyrics-display');
            display.innerHTML = '';

            currentSong.forEach((item, index) => {
                if (item.newLine) {
                    const br = document.createElement('div');
                    br.className = 'line-break';
                    display.appendChild(br);
                } else {
                    const span = document.createElement('span');
                    span.className = 'word';
                    span.id = `word-${index}`;
                    span.innerText = item.text;
                    display.appendChild(span);
                }
            });
        }

        function startSong() {
            initAudio();
            resetSong();
            currentIndex = 0;
            playLoop();
        }

        // Tämä funktio pyörittää karaokea itsestään sanasta seuraavaan
        function playLoop() {
            if (currentIndex >= currentSong.length) {
                return; // Biisi loppui
            }

            const currentStep = currentSong[currentIndex];

            if (currentStep.newLine) {
                currentIndex++;
                playLoop();
                return;
            }

            // Väritetään sanat
            currentSong.forEach((item, index) => {
                const el = document.getElementById(`word-${index}`);
                if (el) {
                    if (index < currentIndex) el.className = 'word passed';
                    else if (index === currentIndex) el.className = 'word active';
                    else el.className = 'word';
                }
            });

            // Soitetaan nuotti automaattisesti
            if (currentStep.note && notes[currentStep.note]) {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.value = notes[currentStep.note];
                
                // Pidetään ääntä yllä melkein koko sanan keston ajan
                const noteDurationSeconds = (currentStep.duration - 50) / 1000;
                
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + noteDurationSeconds);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + noteDurationSeconds);
            }

            // Asetetaan ajastin siirtymään seuraavaan sanaan automaattisesti!
            currentIndex++;
            playTimeout = setTimeout(playLoop, currentStep.duration);
        }

        function resetSong() {
            clearTimeout(playTimeout);
            currentIndex = -1;
            currentSong.forEach((item, index) => {
                const el = document.getElementById(`word-${index}`);
                if (el) el.className = 'word';
            });
        }

        loadSong();
    </script>
</body>
</html>
